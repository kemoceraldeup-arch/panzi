<title>Panzi Dev QR</title>
<style>
  :root { color-scheme: light dark; --bg:#faf8f5; --fg:#1a1a1a; --card:#fff; --border:#e5e0d8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#181614; --fg:#f0ece4; --card:#242019; --border:#3a352c; }
  }
  :root[data-theme="dark"] { --bg:#181614; --fg:#f0ece4; --card:#242019; --border:#3a352c; }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,system-ui,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px; text-align:center; max-width:360px; }
  h1 { font-size:18px; margin:0 0 16px; }
  #qr { background:#fff; padding:12px; border-radius:12px; display:inline-block; }
  code { display:block; margin-top:16px; font-size:12px; word-break:break-all; opacity:0.7; }
  p { font-size:13px; opacity:0.75; margin-top:16px; line-height:1.5; }
</style>
<div class="card">
  <h1>Scan with Expo Go</h1>
  <div id="qr"></div>
  <code>exp://gcqttqq-panzi123-8081.exp.direct</code>
  <p>Works on cellular data or any WiFi network — routed through Expo's tunnel, not your home LAN. The backend API is also tunneled (cloudflared), so pantry/chat/scan features work outdoors too.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  new QRCode(document.getElementById("qr"), {
    text: "exp://gcqttqq-panzi123-8081.exp.direct",
    width: 240,
    height: 240,
  });
</script>
